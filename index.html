<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2A1E">
<meta name="description" content="Campeonato de disputa de pênaltis entre amigos: sorteio da chave, modo ao vivo e ranking de campeões.">
<title>Copa Trans-formação Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2A1E'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23F4F7EF'/%3E%3Cpolygon points='16,12 19.8,14.8 18.4,19.2 13.6,19.2 12.2,14.8' fill='%230B2A1E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B2A1E;
  --bg-deep: #051810;
  --fg: #F4F7EF;
  --fg-soft: #B8C9BD;
  --accent: #C6F432;
  --ink: #0B2A1E;
  --danger: #FF8A7A;
  --panel-bg: rgba(5, 24, 16, 0.6);
  --panel-line: rgba(244, 247, 239, 0.35);
  --card-line: rgba(244, 247, 239, 0.6);
  --card-bg: rgba(244, 247, 239, 0.06);
  --hair: rgba(244, 247, 239, 0.14);
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Archivo', system-ui, sans-serif;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --tabbar-h: 68px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image: radial-gradient(circle, rgba(244, 247, 239, 0.14) 1.5px, transparent 1.6px);
  background-size: 32px 32px;
  color: var(--fg);
  font-family: var(--sans);
  font-weight: 800;
  line-height: 1.35;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
  -webkit-tap-highlight-color: transparent;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.mono {
  font-family: var(--mono);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
}

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

/* ---------- herói ---------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px 32px;
  padding: 28px 0 20px;
  align-items: end;
}
.hero-label { color: var(--accent); font-size: 12px; letter-spacing: 0.18em; margin: 0 0 14px; }
.hero h1 {
  margin: 0;
  font-weight: 900;
  text-transform: uppercase;
  line-height: 0.94;
  letter-spacing: -0.02em;
  font-size: clamp(24px, 8.4vw, 76px);
}
.hero h1 .linha { display: block; overflow: hidden; padding-bottom: 0.04em; }
.hero h1 .linha > span { display: inline-block; white-space: nowrap; animation: sobe .8s var(--ease-out) both; }
.hero h1 .linha:nth-child(2) > span { animation-delay: .08s; }
.hero h1 .linha:nth-child(3) > span { animation-delay: .16s; }
.hero h1 .acc { color: var(--accent); }
@keyframes sobe { from { transform: translateY(105%); } to { transform: none; } }

.tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.tag {
  border: 2px solid var(--fg);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 13px;
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.tag-n { display: inline-block; min-width: 1ch; }
.tag-n.troca { animation: troca .4s var(--ease-spring); }
@keyframes troca { from { transform: translateY(-60%); opacity: 0; } to { transform: none; opacity: 1; } }

.hero-arte { justify-self: end; width: min(100%, 520px); }
.hero-arte svg { width: 100%; height: auto; display: block; }

@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); padding: 48px 0 28px; }
  .hero h1 { font-size: min(4.1vw, 58px); }
  .tag { font-size: 15px; padding: 9px 18px; }
}
@media (max-width: 899px) {
  .hero-arte { justify-self: stretch; width: 100%; max-width: 440px; order: -1; }
  body[data-aba="aovivo"] .hero-arte,
  body[data-aba="aovivo"] .tags { display: none; }
  body[data-aba="aovivo"] .hero h1 { font-size: 30px; }
  body[data-aba="aovivo"] .hero { padding: 18px 0 8px; }
}

/* ---------- mesa-gol ---------- */
.mg-claro { fill: var(--fg); }
.mg-faixa { fill: var(--fg-soft); }
.mg-rede line { stroke: var(--fg); stroke-opacity: .28; stroke-width: 1.5; }
.mg-chao { stroke: var(--fg-soft); stroke-opacity: .7; stroke-width: 2; }
.mg-acc-tr { stroke: var(--accent); fill: none; stroke-width: 3; }
.mg-acc { fill: var(--accent); }
.mg-tinta { fill: var(--ink); }
.mg-tinta-tr { stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
.mg-traj { stroke: var(--accent); stroke-width: 4; stroke-dasharray: 2 11; stroke-linecap: round; fill: none; animation: marcha 1.1s linear infinite; }
@keyframes marcha { to { stroke-dashoffset: -26; } }
.mg-alvo-pulso { transform-box: fill-box; transform-origin: center; animation: pulso 1.8s var(--ease-out) infinite; }
@keyframes pulso { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
.mg-rede.balanca { animation: balanca .6s .45s var(--ease-out); transform-box: fill-box; transform-origin: top center; }
@keyframes balanca { 0% { transform: none; } 30% { transform: scaleY(1.04) translateY(2px); } 60% { transform: scaleY(.99); } 100% { transform: none; } }
.mg-perna.treme { animation: treme .35s .38s; transform-box: fill-box; transform-origin: bottom center; }
@keyframes treme { 25% { transform: rotate(1.4deg); } 50% { transform: rotate(-1.2deg); } 75% { transform: rotate(.6deg); } }

/* ---------- abas ---------- */
.abas {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: rgba(5, 24, 16, 0.94);
  border-top: 2px solid var(--panel-line);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.aba {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 56px;
  border-radius: 12px;
  color: var(--fg-soft);
  font-family: var(--mono);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color .2s;
}
.aba svg { width: 22px; height: 22px; transition: transform .3s var(--ease-spring); }
.aba[aria-selected="true"] { color: var(--accent); }
.aba[aria-selected="true"] svg { transform: translateY(-2px); }
.aba::before {
  content: '';
  position: absolute;
  top: -8px; left: 28%; right: 28%;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform .3s var(--ease-out);
}
.aba[aria-selected="true"]::before { transform: scaleX(1); }
.aba .bolinha {
  position: absolute; top: 8px; right: calc(50% - 18px);
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0 var(--accent);
  animation: aoVivo 1.6s infinite;
}
@keyframes aoVivo { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }

@media (min-width: 900px) {
  body { padding-bottom: 48px; }
  .abas {
    position: sticky;
    top: 0;
    bottom: auto;
    display: flex;
    gap: 6px;
    padding: 10px 0;
    margin-bottom: 24px;
    background: rgba(11, 42, 30, 0.88);
    border-top: 0;
    border-bottom: 2px solid var(--hair);
  }
  .aba {
    flex-direction: row;
    gap: 10px;
    min-height: 46px;
    padding: 0 18px;
    font-size: 12.5px;
    border: 2px solid transparent;
  }
  .aba svg { width: 18px; height: 18px; }
  .aba::before { display: none; }
  .aba:hover { color: var(--fg); }
  .aba[aria-selected="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .aba[aria-selected="true"] svg { transform: none; }
  .aba .bolinha { position: static; }
}

/* ---------- vistas ---------- */
.vista { animation: entra .42s var(--ease-out) both; }
.vista.mesma, .vista.mesma tbody tr, .vista.mesma .pessoa, .vista.mesma .liga::before, .vista.mesma .liga::after { animation: none; }
@keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.vista > * + * { margin-top: 20px; }
.grade-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 900px) { .grade-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } .grade-2 > * + * { margin-top: 0; } }

.painel {
  background: var(--panel-bg);
  border: 2px solid var(--panel-line);
  border-radius: 16px;
  padding: 20px 18px;
}
@media (min-width: 600px) { .painel { padding: 24px; } }
.painel-titulo {
  margin: 0 0 16px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap;
}
.painel-titulo .contador { color: var(--fg-soft); letter-spacing: .1em; }
.regras { margin: 16px 0 0; font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--fg-soft); letter-spacing: .02em; line-height: 1.6; }
.texto { font-weight: 800; color: var(--fg-soft); margin: 0; line-height: 1.5; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 12px;
  font-weight: 900;
  font-size: 16px;
  letter-spacing: .01em;
  transition: transform .15s var(--ease-out), background-color .2s, border-color .2s, color .2s, opacity .2s;
  -webkit-user-select: none; user-select: none;
}
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .4; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-acc { background: var(--accent); color: var(--ink); }
.btn-acc:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 86%, white); }
.btn-linha { border: 2px solid var(--fg); color: var(--fg); }
.btn-linha:hover:not(:disabled) { background: rgba(244, 247, 239, .08); }
.btn-perigo { border: 2px solid var(--danger); color: var(--danger); }
.btn-perigo:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn-mini { min-height: 44px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn-grande { min-height: 60px; padding: 0 30px; font-size: 19px; border-radius: 14px; }
.acoes { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* ---------- participantes ---------- */
.add { display: flex; gap: 10px; }
.campo {
  flex: 1; min-width: 0;
  min-height: 48px;
  padding: 0 14px;
  border-radius: 12px;
  border: 2px solid var(--card-line);
  background: var(--card-bg);
  font-weight: 800;
  font-size: 16px;
  transition: border-color .2s, background-color .2s;
}
.campo::placeholder { color: var(--fg-soft); opacity: .8; }
.campo:focus { outline: none; border-color: var(--accent); background: rgba(244, 247, 239, .1); }
.campo:disabled { opacity: .45; }
.dica { margin: 8px 0 0; font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--fg-soft); display: flex; justify-content: space-between; gap: 12px; }
.erro-msg { color: var(--danger); font-family: var(--mono); font-weight: 700; font-size: 12.5px; margin: 10px 0 0; letter-spacing: .02em; }
.erro-msg:empty { display: none; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.bloqueio {
  display: flex; gap: 12px; align-items: flex-start;
  border: 2px dashed var(--panel-line);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-family: var(--mono); font-weight: 500; font-size: 12.5px; line-height: 1.5; color: var(--fg-soft);
}
.bloqueio svg { width: 18px; height: 18px; flex: none; color: var(--accent); margin-top: 1px; }

.pessoas { list-style: none; margin: 16px 0 0; padding: 0; }
.pessoa {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 0;
  border-top: 1px solid var(--hair);
  animation: entra .35s var(--ease-out) both;
}
.pessoa:first-child { border-top: 0; }
.vista .pessoa.saindo { animation: sai .28s var(--ease-out) forwards; }
@keyframes sai { to { opacity: 0; transform: translateX(24px); } }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  border: 2px solid var(--card-line);
  font-family: var(--mono); font-size: 13px; font-weight: 700;
}
.pessoa-nome { flex: 1; min-width: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.removido { color: var(--fg-soft); font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

.selecao { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.escolha { position: relative; }
.escolha input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.escolha label {
  display: flex; align-items: center; gap: 10px;
  min-height: 52px;
  padding: 0 14px;
  border: 2px solid var(--card-line);
  border-radius: 12px;
  background: var(--card-bg);
  font-size: 16px;
  transition: border-color .2s, background-color .2s, color .2s, transform .15s;
  pointer-events: none;
}
.escolha .marca {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  border: 2px solid var(--card-line);
  display: grid; place-items: center;
  transition: background-color .2s, border-color .2s;
}
.escolha .marca svg { width: 14px; height: 14px; color: var(--ink); transform: scale(0); transition: transform .25s var(--ease-spring); }
.escolha input:checked + label { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.escolha input:checked + label .marca { background: var(--accent); border-color: var(--accent); }
.escolha input:checked + label .marca svg { transform: scale(1); }
.escolha input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 3px; }
.escolha input:active + label { transform: scale(.97); }
.escolha input:disabled + label { opacity: .5; }
.escolha .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.formato {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(244, 247, 239, .05);
  font-family: var(--mono); font-weight: 500; font-size: 12.5px; line-height: 1.6; color: var(--fg-soft);
}
.formato strong { color: var(--fg); font-weight: 700; }
.formato.invalido strong { color: var(--danger); }

.temas { display: flex; gap: 12px; flex-wrap: wrap; }
.tema {
  display: flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 0 16px 0 10px;
  border-radius: 999px;
  border: 2px solid var(--card-line);
  font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .1em;
  transition: border-color .2s;
}
.tema .cor { width: 26px; height: 26px; border-radius: 50%; transition: transform .3s var(--ease-spring); }
.tema[aria-pressed="true"] { border-color: var(--fg); }
.tema[aria-pressed="true"] .cor { transform: scale(1.12); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--fg); }

/* ---------- chaveamento ---------- */
.chave {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0;
}
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col-rotulo { font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; margin: 0 0 2px; }

.liga { position: relative; height: 34px; }
.liga::before {
  content: ''; position: absolute; left: 50%; top: 4px; bottom: 4px;
  border-left: 2px solid var(--accent);
  transform-origin: top;
  animation: traca .5s var(--ease-out) both;
}
@keyframes traca { from { transform: scaleY(0); } }

@media (min-width: 900px) {
  .chave { grid-template-columns: minmax(0, 1.25fr) 44px minmax(0, 1fr) 44px minmax(0, 1fr); align-items: center; }
  .chave.so-final { grid-template-columns: minmax(0, 420px); justify-content: center; }
  .liga { height: auto; align-self: stretch; margin: 26px 0 0; }
  .liga::before {
    left: 0; right: 50%; top: 18%; bottom: 18%;
    border: 2px solid var(--accent); border-left: 0;
    border-radius: 0 6px 6px 0;
    transform-origin: left; animation-name: tracaX;
  }
  .liga::after {
    content: ''; position: absolute; left: 50%; right: 0; top: 50%;
    border-top: 2px solid var(--accent);
    transform-origin: left; animation: tracaX .4s .25s var(--ease-out) both;
  }
  .liga.reta::before { display: none; }
  .liga.reta::after { left: 0; animation-delay: 0s; }
}
@keyframes tracaX { from { transform: scaleX(0); } }

.cartao {
  position: relative;
  border: 2px solid var(--card-line);
  border-radius: 10px;
  background: var(--card-bg);
  padding: 12px 14px;
  min-height: 52px;
  transition: border-color .3s, background-color .3s, transform .3s var(--ease-out);
}
.cartao.jogando { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.cartao.pendente { border-style: dashed; border-color: var(--panel-line); }
.cartao-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.confronto { font-size: 17px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-width: 0; }
.confronto .x { color: var(--fg-soft); font-size: 15px; }
.confronto .perdeu { color: var(--fg-soft); }
.num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--fg-soft); margin-right: 2px; }
.placar-mini { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; letter-spacing: .04em; }
.meta { margin-top: 4px; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .1em; color: var(--fg-soft); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.ponto-vivo { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: aoVivo 1.6s infinite; }

.cartao-semi .titulo-semi, .cartao-final .titulo-final { font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-soft); text-align: center; margin-bottom: 6px; }
.cartao-final { border-width: 3px; border-color: var(--accent); text-align: center; padding: 14px; }
.cartao-final .titulo-final { color: var(--accent); }
.vaga { font-size: 16px; line-height: 1.25; }
.vaga.vazia { font-size: 13.5px; text-transform: uppercase; letter-spacing: .02em; }
.vaga + .vaga { margin-top: 6px; }
.vaga.perdeu { color: var(--fg-soft); }
.direto {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .14em; color: var(--fg-soft); text-transform: uppercase;
}
.direto::after { content: ''; flex: 1; border-top: 2px solid var(--accent); }
.haste { width: 2px; height: 18px; background: var(--accent); margin: 0 auto; }
.selo {
  background: var(--accent);
  color: var(--ink);
  font-weight: 900;
  border-radius: 10px;
  padding: 12px 16px;
  text-align: center;
  font-size: 19px;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.selo small { display: block; font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .14em; opacity: .75; margin-bottom: 2px; }
.selo.carimba { animation: carimba .6s var(--ease-spring) both; }
@keyframes carimba { from { transform: scale(1.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }

.slot.rolando { color: var(--fg-soft); filter: blur(.4px); }
.slot.travou { animation: trava .45s var(--ease-spring); color: var(--accent); }
@keyframes trava { from { transform: scale(1.25); } to { transform: none; } }

/* ---------- tabela ---------- */
.tabela-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th {
  font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .1em;
  color: var(--fg-soft); text-transform: uppercase;
  text-align: center; padding: 8px 4px; border-bottom: 2px solid var(--panel-line);
}
td { text-align: center; padding: 11px 4px; border-bottom: 1px solid var(--hair); font-size: 15px; }
th.esq, td.esq { text-align: left; }
td.jogador { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.pts { color: var(--accent); font-size: 17px; }
td.pos { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--fg-soft); width: 34px; }
tr.vaga-direta td.pos, tr.vaga-semi td.pos { color: var(--ink); }
tr.vaga-direta td.pos span, tr.vaga-semi td.pos span {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px;
}
tr.vaga-direta td.pos span { background: var(--accent); }
tr.vaga-semi td.pos span { background: var(--fg-soft); }
tbody tr { animation: entra .35s var(--ease-out) both; }
tbody tr:nth-child(2) { animation-delay: .04s; }
tbody tr:nth-child(3) { animation-delay: .08s; }
tbody tr:nth-child(4) { animation-delay: .12s; }
tbody tr:nth-child(n+5) { animation-delay: .16s; }
.legenda { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--fg-soft); }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 420px) {
  td, th { padding-left: 2px; padding-right: 2px; }
  td { font-size: 14px; }
  .col-opc { display: none; }
}

/* ---------- ao vivo ---------- */
.palco { text-align: center; }
.fase-rotulo { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; margin: 0; }
.palco-arte { position: relative; max-width: 380px; margin: 10px auto 0; }
.palco-arte svg { width: 100%; height: auto; display: block; }
.anuncio {
  position: absolute; left: 50%; top: 52%;
  transform: translate(-50%, -50%);
  padding: 4px 16px 6px;
  border-radius: 10px;
  font-weight: 900; font-size: clamp(26px, 8vw, 40px); letter-spacing: -.01em; text-transform: uppercase;
  pointer-events: none; white-space: nowrap;
  animation: anuncia 1.3s .35s var(--ease-out) both;
}
.anuncio.gol { background: var(--accent); color: var(--ink); }
.anuncio.erro { background: var(--bg-deep); color: var(--danger); border: 2px solid var(--danger); }
@keyframes anuncia {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  35% { transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -70%); }
}

.placar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  gap: 8px;
  margin-top: 14px;
}
.lado { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; container-type: inline-size; }
.lado-nome {
  font-size: max(13px, min(30px, calc(132cqw / var(--len, 6))));
  text-transform: uppercase; line-height: 1.05;
  max-width: 100%;
  transition: color .25s;
}
.lado.vez .lado-nome { color: var(--accent); }
.vez-tag {
  font-family: var(--mono); font-weight: 700; font-size: 10.5px; letter-spacing: .16em;
  padding: 4px 9px; border-radius: 999px;
  background: var(--accent); color: var(--ink);
  visibility: hidden;
}
.lado.vez .vez-tag { visibility: visible; animation: piscaVez 1.4s ease-in-out infinite; }
@keyframes piscaVez { 50% { opacity: .55; } }
.gols {
  font-family: var(--mono); font-weight: 700;
  font-size: clamp(44px, 12.5vw, 84px);
  line-height: 1; letter-spacing: -.02em;
  display: flex; gap: .2em; align-items: center;
  padding-top: 4px;
}
.gols .sep { color: var(--fg-soft); font-size: .6em; }
.gols .n { display: inline-block; min-width: .62em; }
.gols .n.bump { animation: bump .55s var(--ease-spring); color: var(--accent); }
@keyframes bump { 0% { transform: scale(1.5); } 100% { transform: none; } }

.trilha { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 190px; }
.marc { width: 22px; height: 22px; display: block; }
.marc.novo { animation: pop .45s var(--ease-spring); }
@keyframes pop { from { transform: scale(0); } to { transform: none; } }
.marc .anel { fill: none; stroke: var(--card-line); stroke-width: 2; }
.marc .cheio { fill: var(--accent); }
.marc .xis { stroke: var(--danger); stroke-width: 2.4; stroke-linecap: round; }
.marc.erro .anel { stroke: var(--danger); }
.ms-sep { width: 2px; height: 22px; background: var(--accent); border-radius: 2px; margin: 0 2px; }

.ms-badge {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 14px;
  padding: 6px 14px; border-radius: 999px;
  border: 2px solid var(--accent); color: var(--accent);
  font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
  animation: entra .4s var(--ease-out);
}

.cobrar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px auto 0; max-width: 560px; }
.placar { max-width: 720px; margin-left: auto; margin-right: auto; }
.chute {
  min-height: 88px;
  border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-weight: 900; font-size: 26px; letter-spacing: .02em;
  transition: transform .12s var(--ease-out), background-color .2s, box-shadow .2s;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.chute small { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chute:active:not(:disabled) { transform: scale(.95); }
.chute-gol { background: var(--accent); color: var(--ink); box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 45%, black); }
.chute-gol:active:not(:disabled) { box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 45%, black); transform: translateY(4px) scale(.98); }
.chute-erro { border: 3px solid var(--danger); color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
.chute:disabled { opacity: .4; }

.rodape-vivo { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

.segmento {
  display: flex; gap: 4px; width: max-content; max-width: 100%;
  margin: 0 auto; padding: 4px;
  border: 2px solid var(--panel-line); border-radius: 14px;
  background: var(--panel-bg);
}
.seg {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 20px; border-radius: 10px;
  font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg-soft);
  transition: color .2s, background-color .25s;
}
.seg svg { width: 18px; height: 18px; }
.seg:hover { color: var(--fg); }
.seg[aria-pressed="true"] { background: var(--accent); color: var(--ink); animation: segIn .35s var(--ease-spring); }
@keyframes segIn { from { transform: scale(.9); } }

.mini-vivo {
  position: sticky; top: 8px; z-index: 30;
  text-align: center;
  padding: 12px 14px 14px;
  background: rgba(5, 24, 16, .94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
}
@media (min-width: 900px) { .mini-vivo { top: 80px; padding: 16px 20px 18px; } }
.mini-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mini-topo .fase-rotulo { text-align: left; }
.btn.icone-so { width: 44px; min-height: 44px; padding: 0; border-radius: 10px; flex: none; }
.compacto { position: relative; }
.compacto .placar { margin-top: 4px; gap: 6px; }
.compacto .lado { gap: 5px; }
.compacto .lado-nome { font-size: max(12px, min(20px, calc(132cqw / var(--len, 6)))); }
.compacto .gols { font-size: clamp(34px, 9vw, 52px); padding-top: 14px; }
.compacto .marc { width: 14px; height: 14px; }
.compacto .ms-sep { height: 14px; }
.compacto .trilha { gap: 4px; }
.compacto .vez-tag { font-size: 9.5px; padding: 3px 7px; }
.compacto .anuncio { top: 50%; font-size: clamp(20px, 6vw, 30px); }
.cobrar.compacto-btns { margin-top: 12px; gap: 10px; }
.cobrar.compacto-btns .chute { min-height: 60px; font-size: 21px; border-radius: 14px; }
.mini-venc { margin: 10px 0 0; font-size: clamp(22px, 6vw, 32px); text-transform: uppercase; line-height: 1.05; overflow-wrap: anywhere; animation: entra .45s var(--ease-out) both; }
.mini-venc span { color: var(--accent); }

.cartao.jogando { animation: brilho 2.2s ease-in-out infinite; }
@keyframes brilho {
  0%, 100% { box-shadow: 0 0 0 0 transparent; }
  50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 24%, transparent); }
}
.cartao.acabou { animation: acabou 1.1s var(--ease-out); }
@keyframes acabou {
  0% { background: color-mix(in srgb, var(--accent) 38%, transparent); border-color: var(--accent); transform: scale(1.02); }
}
.placar-mini.bump { display: inline-block; animation: bump .55s var(--ease-spring); }
.slot.chega { display: inline-block; color: var(--accent); animation: chega .75s .3s var(--ease-spring) both; }
@keyframes chega { from { opacity: 0; transform: translateX(-30px) scale(.9); } to { opacity: 1; transform: none; } }

.fim-jogo .vencedor { font-size: clamp(32px, 9vw, 60px); text-transform: uppercase; line-height: 1; margin: 8px 0 4px; animation: entra .5s var(--ease-out) both; overflow-wrap: anywhere; }
.fim-jogo .vencedor span { color: var(--accent); }

.proximas { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.proximas li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(244, 247, 239, .04); font-size: 15px; }
.proximas li .meta { margin: 0; }

.vazio { text-align: center; padding: 36px 18px; }
.vazio > svg { width: 160px; height: auto; margin: 0 auto 14px; display: block; }
.vazio h2 { margin: 0 0 8px; font-size: 24px; text-transform: uppercase; }
.vazio .acoes { justify-content: center; margin-top: 18px; }

.desempate-lista { list-style: none; padding: 0; margin: 18px auto 0; max-width: 340px; display: grid; gap: 8px; counter-reset: d; }
.desempate-lista li {
  counter-increment: d;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 10px;
  border: 2px solid var(--card-line); background: var(--card-bg);
  font-size: 18px;
}
.desempate-lista li::before { content: counter(d) 'º'; font-family: var(--mono); font-size: 13px; color: var(--accent); min-width: 26px; }
.desempate-lista.final li { animation: entra .4s var(--ease-out) both; border-color: var(--accent); }
.desempate-lista.final li:nth-child(2) { animation-delay: .12s; }
.desempate-lista.final li:nth-child(3) { animation-delay: .24s; }
.desempate-lista.final li:nth-child(4) { animation-delay: .36s; }

/* campeão */
.campeao { position: relative; overflow: hidden; text-align: center; padding: 40px 18px 32px; }
.campeao canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.campeao .selo { display: inline-block; font-size: clamp(22px, 6vw, 30px); padding: 12px 28px; }
.campeao-nome {
  font-size: clamp(44px, 14vw, 120px); line-height: .92; letter-spacing: -.02em; text-transform: uppercase;
  margin: 22px 0 10px; overflow-wrap: anywhere;
}
.campeao-nome .letra { display: inline-block; animation: letra .6s var(--ease-spring) both; }
@keyframes letra { from { opacity: 0; transform: translateY(40%) rotate(8deg); } to { opacity: 1; transform: none; } }
.campeao .vice { font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-soft); }
.campeao .acoes { justify-content: center; margin-top: 26px; }
.salvo-ok { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-family: var(--mono); font-weight: 700; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; }
.salvo-ok svg { width: 18px; height: 18px; }

/* ---------- campeões ---------- */
.podio-1 td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.historico { list-style: none; margin: 0; padding: 0; }
.historico li {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center;
  padding: 14px 0; border-top: 1px solid var(--hair);
}
.historico li:first-child { border-top: 0; padding-top: 0; }
.historico .data { font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .12em; color: var(--fg-soft); }
.historico .quem { font-size: 17px; margin: 2px 0; }
.historico .quem .acc { color: var(--accent); }
.historico .lista { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--fg-soft); }
.historico .btn { grid-row: 1 / span 3; grid-column: 2; }

/* ---------- modal e toast ---------- */
.modal-fundo {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(3, 14, 9, .72);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: grid; place-items: end center;
  padding: 16px;
  animation: fade .2s both;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: 100%; max-width: 440px;
  background: var(--bg);
  border: 2px solid var(--panel-line);
  border-radius: 18px;
  padding: 22px;
  animation: sobeModal .32s var(--ease-out) both;
}
@media (min-width: 600px) { .modal-fundo { place-items: center; } }
@keyframes sobeModal { from { transform: translateY(30px); opacity: 0; } }
.modal h2 { margin: 0 0 8px; font-size: 22px; text-transform: uppercase; }
.modal p { margin: 0; color: var(--fg-soft); line-height: 1.5; }
.modal .acoes { justify-content: flex-end; margin-top: 22px; }

.toasts {
  position: fixed; z-index: 90;
  left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);
  display: grid; gap: 8px; width: min(92vw, 420px);
  pointer-events: none;
}
@media (min-width: 900px) { .toasts { bottom: 24px; } }
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: 12px;
  background: var(--fg); color: var(--ink);
  font-weight: 800; font-size: 15px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  animation: toastIn .35s var(--ease-spring) both;
}
.toast.erro { background: var(--danger); }
.toast.sai { animation: toastOut .25s ease-in forwards; }
.toast svg { width: 18px; height: 18px; flex: none; }
@keyframes toastIn { from { transform: translateY(20px) scale(.95); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(10px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
}
</style>
</head>
